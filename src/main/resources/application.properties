# =====================================================================
# CyberShield - shared configuration (all profiles)
# Credentials are read from environment variables - never commit real passwords.
# =====================================================================
spring.application.name=CyberShield
server.port=8080

# When no profile is given (e.g. plain "mvnw spring-boot:run"), run as "dev".
# A production deployment must start with --spring.profiles.active=prod (or any non-dev profile),
# which disables the demo data initializer.
spring.profiles.default=dev

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cybershield_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:cybershield_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# ---------- JPA / Hibernate ----------
# Flyway owns the schema; Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=25

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=true

# ---------- File uploads (evidence) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=-1
cybershield.upload-dir=${UPLOAD_DIR:./uploads}

# ---------- Session & errors ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ---------- Scheduler (deadline / overdue reminders) ----------
cybershield.scheduler.enabled=true
# every hour, first run 20 seconds after start-up (values in milliseconds)
cybershield.scheduler.deadline-check-interval-ms=3600000
cybershield.scheduler.initial-delay-ms=20000
# a task is "approaching its deadline" when it is due within this many days
cybershield.scheduler.deadline-warning-days=2

# ---------- Demo data (only used by the dev profile) ----------
cybershield.demo-data.enabled=false

logging.level.root=INFO
logging.level.com.cybershield=INFO
