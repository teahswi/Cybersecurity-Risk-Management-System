# =====================================================================
# Development profile - local laptop with MySQL Workbench
# Activate with: -Dspring-boot.run.profiles=dev (or it is the default profile)
# =====================================================================
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true

# Idempotent demo users + sample records (never runs outside the dev profile)
cybershield.demo-data.enabled=true

logging.level.com.cybershield=DEBUG
logging.level.org.flywaydb=INFO
