<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head('Risk Register')}"></head>
<body>
<div class="cs-app">
    <aside th:replace="~{fragments/layout :: sidebar('risks')}"></aside>
    <div class="cs-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="cs-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

<div class="cs-page-header"><div><h1>Risk Register</h1>
    <p class="cs-subtitle">Risk Score = Likelihood &times; Impact (1-5 each). Low 1-4, Medium 5-9, High 10-16, Critical 17-25.</p></div>
    <a th:if="${currentUser.securityOps}" class="btn btn-primary" th:href="@{/risks/new}"><i class="bi bi-plus-lg me-1"></i>New risk assessment</a></div>
<div class="row g-3 mb-3">
    <div class="col-lg-8">
        <form class="cs-filter-bar row g-2 align-items-end h-100" th:action="@{/risks}" method="get">
            <div class="col-md-4"><label class="form-label small">Search</label><input class="form-control" name="q" th:value="${q}" placeholder="Code or title"></div>
            <div class="col-md-3"><label class="form-label small">Risk level</label><select class="form-select" name="level"><option value="">All</option>
                <option th:each="l : ${levels}" th:value="${l}" th:text="${l.label}" th:selected="${l == level}"></option></select></div>
            <div class="col-md-3"><label class="form-label small">Status</label><select class="form-select" name="status"><option value="">All</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select></div>
            <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary flex-fill" type="submit"><i class="bi bi-funnel"></i></button>
                <a class="btn btn-outline-secondary" th:href="@{/risks}"><i class="bi bi-x-lg"></i></a></div>
        </form>
    </div>
    <div class="col-lg-4"><div class="card h-100"><div class="card-header small">Open risk distribution (likelihood &times; impact)</div>
        <div class="card-body d-flex justify-content-center">
            <table class="cs-matrix"><tbody>
                <tr th:each="l : ${ {5,4,3,2,1} }">
                    <th class="small cs-muted pe-2" th:text="|L${l}|">L</th>
                    <td th:each="i : ${ {1,2,3,4,5} }" th:with="score=${l * i}"
                        th:classappend="${score <= 4} ? 'lvl-low' : (${score <= 9} ? 'lvl-medium' : (${score <= 16} ? 'lvl-high' : 'lvl-critical'))"
                        th:text="${matrix.count(l, i) > 0} ? ${matrix.count(l, i)} : ''" th:title="|Score ${score}|"></td>
                </tr>
                <tr><th></th><th th:each="i : ${ {1,2,3,4,5} }" class="small cs-muted text-center" th:text="|I${i}|">I</th></tr>
            </tbody></table>
        </div></div></div>
</div>
<div class="card"><div class="table-responsive">
    <table class="table align-middle" th:unless="${page.empty}">
        <thead><tr><th><a th:replace="~{fragments/layout :: sortable('riskCode', 'Risk')}"></a></th><th>Asset</th><th>L &times; I</th><th><a th:replace="~{fragments/layout :: sortable('riskScore', 'Score')}"></a></th>
            <th>Level</th><th>Strategy</th><th>Owner</th><th><a th:replace="~{fragments/layout :: sortable('status', 'Status')}"></a></th><th></th></tr></thead>
        <tbody><tr th:each="r : ${page.content}">
            <td><a class="cs-code" th:href="@{/risks/{id}(id=${r.id})}" th:text="${r.riskCode}">R</a><div class="small fw-semibold" th:text="${r.title}">t</div></td>
            <td class="cs-code small" th:text="${r.assetCode}">A</td><td class="small" th:text="|${r.likelihood} x ${r.impact}|">x</td>
            <td class="fw-bold fs-5" th:text="${r.riskScore}">0</td><td><span th:replace="~{fragments/layout :: badge(${r.riskLevel})}"></span></td>
            <td class="small" th:text="${r.treatmentStrategy.label}">s</td><td class="small" th:text="${r.ownerName ?: '-'}">o</td>
            <td><span th:replace="~{fragments/layout :: badge(${r.status})}"></span></td>
            <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/risks/{id}(id=${r.id})}">View</a></td>
        </tr></tbody>
    </table>
    <div class="cs-empty" th:if="${page.empty}"><i class="bi bi-inbox"></i>No risks match your filters.</div>
</div><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
