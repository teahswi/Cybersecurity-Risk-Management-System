<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head('Incidents')}"></head>
<body>
<div class="cs-app">
    <aside th:replace="~{fragments/layout :: sidebar('incidents')}"></aside>
    <div class="cs-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="cs-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

<div class="cs-page-header"><div><h1>Incident Management</h1><p class="cs-subtitle">Investigations with linked alerts, affected assets and notes.</p></div>
    <a class="btn btn-primary" th:href="@{/incidents/new}"><i class="bi bi-plus-lg me-1"></i>New incident</a></div>
<form class="cs-filter-bar row g-2 align-items-end" th:action="@{/incidents}" method="get">
    <div class="col-md-3"><label class="form-label small">Search</label><input class="form-control" name="q" th:value="${q}" placeholder="Code or title"></div>
    <div class="col-md-2"><label class="form-label small">Status</label><select class="form-select" name="status"><option value="">All</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select></div>
    <div class="col-md-2"><label class="form-label small">Severity</label><select class="form-select" name="severity"><option value="">All</option>
        <option th:each="s : ${severities}" th:value="${s}" th:text="${s.label}" th:selected="${s == severity}"></option></select></div>
    <div class="col-md-3"><label class="form-label small">Type</label><select class="form-select" name="type"><option value="">All</option>
        <option th:each="s : ${types}" th:value="${s}" th:text="${s.label}" th:selected="${s == type}"></option></select></div>
    <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary flex-fill" type="submit"><i class="bi bi-funnel"></i></button>
        <a class="btn btn-outline-secondary" th:href="@{/incidents}"><i class="bi bi-x-lg"></i></a></div>
</form>
<div class="card"><div class="table-responsive">
    <table class="table align-middle" th:unless="${page.empty}">
        <thead><tr><th><a th:replace="~{fragments/layout :: sortable('incidentCode', 'Incident')}"></a></th><th>Type</th><th><a th:replace="~{fragments/layout :: sortable('severity', 'Severity')}"></a></th>
            <th><a th:replace="~{fragments/layout :: sortable('status', 'Status')}"></a></th><th>Investigator</th><th><a th:replace="~{fragments/layout :: sortable('detectedAt', 'Detected')}"></a></th><th></th></tr></thead>
        <tbody><tr th:each="i : ${page.content}">
            <td><a class="cs-code" th:href="@{/incidents/{id}(id=${i.id})}" th:text="${i.incidentCode}">I</a><div class="small fw-semibold" th:text="${i.title}">t</div></td>
            <td class="small" th:text="${i.incidentType.label}">t</td><td><span th:replace="~{fragments/layout :: badge(${i.severity})}"></span></td><td><span th:replace="~{fragments/layout :: badge(${i.status})}"></span></td>
            <td class="small" th:text="${i.analystName ?: 'Unassigned'}">n</td><td class="small" th:text="${i.detectedAt != null ? #temporals.format(i.detectedAt, 'dd MMM yyyy, HH:mm') : '-'}">d</td>
            <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/incidents/{id}(id=${i.id})}">View</a></td>
        </tr></tbody>
    </table>
    <div class="cs-empty" th:if="${page.empty}"><i class="bi bi-inbox"></i>No incidents match your filters.</div>
</div><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
