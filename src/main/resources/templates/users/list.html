<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<div class="cs-app">
    <aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
    <div class="cs-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="cs-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

<div class="cs-page-header"><div><h1>User Management</h1><p class="cs-subtitle">Accounts are created by a Security Manager - there is no public registration.</p></div>
    <a class="btn btn-primary" th:href="@{/users/new}"><i class="bi bi-person-plus me-1"></i>Create user</a></div>
<form class="cs-filter-bar row g-2 align-items-end" th:action="@{/users}" method="get">
    <div class="col-md-4"><label class="form-label small">Search</label><input class="form-control" name="q" th:value="${q}" placeholder="Name, username or email"></div>
    <div class="col-md-3"><label class="form-label small">Role</label><select class="form-select" name="role"><option value="">All</option>
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == role}"></option></select></div>
    <div class="col-md-3"><label class="form-label small">Status</label><select class="form-select" name="status"><option value="">All</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select></div>
    <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary flex-fill" type="submit"><i class="bi bi-funnel"></i></button>
        <a class="btn btn-outline-secondary" th:href="@{/users}"><i class="bi bi-x-lg"></i></a></div>
</form>
<div class="card"><div class="table-responsive"><table class="table align-middle" th:unless="${page.empty}">
    <thead><tr><th><a th:replace="~{fragments/layout :: sortable('fullName', 'Name')}"></a></th><th><a th:replace="~{fragments/layout :: sortable('username', 'Username')}"></a></th><th><a th:replace="~{fragments/layout :: sortable('email', 'Email')}"></a></th>
        <th>Role</th><th>Department</th><th><a th:replace="~{fragments/layout :: sortable('status', 'Status')}"></a></th><th><a th:replace="~{fragments/layout :: sortable('lastLoginAt', 'Last login')}"></a></th><th></th></tr></thead>
    <tbody><tr th:each="u : ${page.content}">
        <td class="fw-semibold"><a th:href="@{/users/{id}(id=${u.id})}" th:text="${u.fullName}">n</a></td>
        <td class="cs-code" th:text="${u.username}">u</td><td class="small" th:text="${u.email}">e</td>
        <td class="small" th:text="${u.role.label}">r</td><td class="small" th:text="${u.departmentName ?: '-'}">d</td>
        <td><span th:replace="~{fragments/layout :: badge(${u.status})}"></span></td><td class="small" th:text="${u.lastLoginAt != null ? #temporals.format(u.lastLoginAt, 'dd MMM yyyy, HH:mm') : '-'}">l</td>
        <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/users/{id}(id=${u.id})}">View</a></td></tr></tbody></table>
    <div class="cs-empty" th:if="${page.empty}">No users found.</div></div><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
