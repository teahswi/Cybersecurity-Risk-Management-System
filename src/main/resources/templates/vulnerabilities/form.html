<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head(${vulnerabilityId == null} ? 'New vulnerability' : 'Edit vulnerability')}"></head>
<body>
<div class="cs-app">
    <aside th:replace="~{fragments/layout :: sidebar('vulnerabilities')}"></aside>
    <div class="cs-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="cs-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

<div class="cs-page-header"><div><h1 th:text="${vulnerabilityId == null} ? 'New vulnerability definition' : 'Edit vulnerability'">Vulnerability</h1>
    <p class="cs-subtitle">A definition can affect many assets. CVE is optional - leave it empty for internal findings.</p></div></div>
<form class="card card-body" th:action="${vulnerabilityId == null} ? @{/vulnerabilities} : @{/vulnerabilities/{id}(id=${vulnerabilityId})}" th:object="${form}" method="post" novalidate>
    <div class="row g-3">
        <div class="col-md-8"><label class="form-label" for="title">Title *</label><input class="form-control" th:field="*{title}" th:errorclass="is-invalid" required maxlength="200">
            <div class="invalid-feedback" th:errors="*{title}"></div></div>
        <div class="col-md-4"><label class="form-label" for="cveId">CVE identifier</label><input class="form-control" th:field="*{cveId}" th:errorclass="is-invalid" maxlength="30" placeholder="CVE-YYYY-NNNN">
            <div class="invalid-feedback" th:errors="*{cveId}"></div></div>
        <div class="col-md-4"><label class="form-label" for="severity">Severity *</label><select class="form-select" th:field="*{severity}" th:errorclass="is-invalid" required>
            <option value="">Choose...</option><option th:each="s : ${severities}" th:value="${s}" th:text="${s.label}"></option></select>
            <div class="invalid-feedback" th:errors="*{severity}"></div></div>
        <div class="col-md-4"><label class="form-label" for="cvssScore">CVSS score (0.0 - 10.0) *</label>
            <input class="form-control" type="number" step="0.1" min="0" max="10" th:field="*{cvssScore}" th:errorclass="is-invalid" required>
            <div class="invalid-feedback" th:errors="*{cvssScore}"></div></div>
        <div class="col-12"><label class="form-label" for="description">Description *</label><textarea class="form-control" th:field="*{description}" th:errorclass="is-invalid" rows="4" required maxlength="5000"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div></div>
        <div class="col-12"><label class="form-label" for="recommendedRemediation">Recommended remediation</label>
            <textarea class="form-control" th:field="*{recommendedRemediation}" rows="3" maxlength="5000"></textarea></div>
    </div>
    <div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>Save</button>
        <a class="btn btn-outline-secondary" th:href="@{/vulnerabilities}">Cancel</a></div>
</form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
