<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head(${s.name})}"></head>
<body>
<div class="cs-app">
    <aside th:replace="~{fragments/layout :: sidebar('software')}"></aside>
    <div class="cs-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="cs-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

<div class="cs-page-header"><div><h1 th:text="${s.name}">Software</h1>
    <p class="cs-subtitle" th:text="|${s.vendor} - ${s.category.label}|">sub</p></div>
    <a th:if="${currentUser.manager}" class="btn btn-outline-secondary" th:href="@{/software/{id}/edit(id=${s.id})}"><i class="bi bi-pencil me-1"></i>Edit</a></div>
<div class="row g-3">
    <div class="col-lg-4"><div class="card"><div class="card-header">Details</div><div class="card-body"><dl class="cs-dl mb-0">
        <dt>Baseline version</dt><dd class="cs-code" th:text="${s.baselineVersion ?: 'Not defined'}">b</dd>
        <dt>Installations</dt><dd th:text="${#lists.size(s.installations)}">0</dd>
        <dt>Outdated installations</dt><dd><span class="badge cs-badge" th:classappend="${s.outdatedCount > 0} ? 'cs-high' : 'cs-completed'" th:text="${s.outdatedCount}">0</span></dd>
        <dt>Description</dt><dd th:text="${s.description ?: '-'}">d</dd>
        <dt>Last updated</dt><dd th:text="${s.updatedAt != null ? #temporals.format(s.updatedAt, 'dd MMM yyyy, HH:mm') : '-'}">d</dd></dl></div></div></div>
    <div class="col-lg-8"><div class="card">
        <div class="card-header d-flex justify-content-between align-items-center"><span>Assets with this software</span>
            <button th:if="${currentUser.manager}" class="btn btn-sm btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#installSw"><i class="bi bi-plus"></i> Link to asset</button></div>
        <div id="installSw" class="collapse border-bottom" th:if="${currentUser.manager}">
            <form class="row g-2 p-3" th:action="@{/asset-software}" th:object="${installForm}" method="post">
                <input type="hidden" th:field="*{softwareId}"><input type="hidden" name="returnTo" value="software">
                <div class="col-md-4"><select class="form-select form-select-sm" th:field="*{assetId}" required><option value="">Asset...</option>
                    <option th:each="o : ${assetOptions}" th:value="${o.id}" th:text="${o.label}"></option></select></div>
                <div class="col-md-2"><input class="form-control form-control-sm" th:field="*{installedVersion}" placeholder="Version" required maxlength="50"></div>
                <div class="col-md-2"><input type="date" class="form-control form-control-sm" th:field="*{installationDate}" title="Installation date"></div>
                <div class="col-md-2"><select class="form-select form-select-sm" th:field="*{licenseType}" required><option value="">Licence...</option>
                    <option th:each="l : ${licenseTypes}" th:value="${l}" th:text="${l.label}"></option></select></div>
                <div class="col-md-2"><input type="date" class="form-control form-control-sm" th:field="*{licenseExpiryDate}" title="Licence expiry"></div>
                <div class="col-12"><button class="btn btn-sm btn-primary" type="submit">Save installation</button></div>
            </form>
        </div>
        <div class="table-responsive"><table class="table align-middle" th:unless="${#lists.isEmpty(s.installations)}">
            <thead><tr><th>Asset</th><th>Department</th><th>Installed version</th><th>Installed on</th><th>Licence</th><th>Expiry</th></tr></thead>
            <tbody><tr th:each="x : ${s.installations}">
                <td><a class="cs-code" th:href="@{/assets/{id}(id=${x.assetId})}" th:text="${x.assetCode}">A</a><div class="small" th:text="${x.assetName}">n</div></td>
                <td class="small" th:text="${x.departmentName}">d</td>
                <td><span class="cs-code" th:text="${x.installedVersion}">v</span> <span th:if="${x.outdated}" class="badge cs-badge cs-high">Outdated</span></td>
                <td class="small" th:text="${x.installationDate != null ? #temporals.format(x.installationDate, 'dd MMM yyyy') : '-'}">d</td>
                <td class="small" th:text="${x.licenseType.label}">l</td><td class="small" th:text="${x.licenseExpiryDate != null ? #temporals.format(x.licenseExpiryDate, 'dd MMM yyyy') : '-'}">e</td>
            </tr></tbody></table>
            <div class="cs-empty" th:if="${#lists.isEmpty(s.installations)}"><i class="bi bi-hdd"></i>Not installed on any asset.</div></div>
    </div></div>
</div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
