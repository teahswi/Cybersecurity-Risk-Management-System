<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head(${currentUser.engineer} ? 'My Assigned Tasks' : 'Remediation Tasks')}"></head>
<body>
<div class="cs-app">
    <aside th:replace="~{fragments/layout :: sidebar('remediation')}"></aside>
    <div class="cs-main">
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="cs-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

<div class="cs-page-header"><div><h1 th:text="${currentUser.engineer} ? 'My Assigned Tasks' : 'Remediation Tasks'">Tasks</h1>
    <p class="cs-subtitle" th:text="${currentUser.engineer} ? 'Only tasks assigned to your account are shown.' : 'Create tasks from an affected asset vulnerability (Assets or Vulnerabilities page).'">s</p></div></div>
<div class="row g-3 mb-3">
    <div class="col-6 col-md-2"><div class="card card-body py-2"><div class="small cs-muted">Total</div><div class="fs-4 fw-bold" th:text="${progress.total}">0</div></div></div>
    <div class="col-6 col-md-2"><div class="card card-body py-2"><div class="small cs-muted">Assigned</div><div class="fs-4 fw-bold" th:text="${progress.assigned + progress.reopened}">0</div></div></div>
    <div class="col-6 col-md-2"><div class="card card-body py-2"><div class="small cs-muted">In progress</div><div class="fs-4 fw-bold" th:text="${progress.inProgress}">0</div></div></div>
    <div class="col-6 col-md-2"><div class="card card-body py-2"><div class="small cs-muted">Pending verification</div><div class="fs-4 fw-bold" th:text="${progress.pendingVerification}">0</div></div></div>
    <div class="col-6 col-md-2"><div class="card card-body py-2"><div class="small cs-muted">Overdue</div><div class="fs-4 fw-bold text-danger" th:text="${progress.overdue}">0</div></div></div>
    <div class="col-6 col-md-2"><div class="card card-body py-2"><div class="small cs-muted">Completed</div>
        <div class="fs-4 fw-bold text-success" th:text="|${progress.completed} (${progress.completionPercent}%)|">0</div></div></div>
</div>
<form class="cs-filter-bar row g-2 align-items-end" th:action="@{/remediation}" method="get">
    <div class="col-md-3"><label class="form-label small">Search</label><input class="form-control" name="q" th:value="${q}" placeholder="Task code, title or asset code"></div>
    <div class="col-md-2"><label class="form-label small">Status</label><select class="form-select" name="status"><option value="">All</option>
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select></div>
    <div class="col-md-2"><label class="form-label small">Priority</label><select class="form-select" name="priority"><option value="">All</option>
        <option th:each="s : ${priorities}" th:value="${s}" th:text="${s.label}" th:selected="${s == priority}"></option></select></div>
    <div class="col-md-2" th:unless="${currentUser.engineer}"><label class="form-label small">Engineer</label><select class="form-select" name="engineerId"><option value="">All</option>
        <option th:each="e : ${engineers}" th:value="${e.id}" th:text="${e.label}" th:selected="${e.id == engineerId}"></option></select></div>
    <div class="col-md-1"><div class="form-check mt-4"><input class="form-check-input" type="checkbox" name="overdue" value="true" id="overdue" th:checked="${overdue}">
        <label class="form-check-label small" for="overdue">Overdue</label></div></div>
    <div class="col-md-2 d-flex gap-2"><button class="btn btn-primary flex-fill" type="submit"><i class="bi bi-funnel"></i> Filter</button>
        <a class="btn btn-outline-secondary" th:href="@{/remediation}"><i class="bi bi-x-lg"></i></a></div>
</form>
<div class="card mb-3"><div class="table-responsive">
    <table class="table align-middle" th:unless="${page.empty}">
        <thead><tr><th><a th:replace="~{fragments/layout :: sortable('taskCode', 'Task')}"></a></th><th>Asset / Vulnerability</th><th><a th:replace="~{fragments/layout :: sortable('priority', 'Priority')}"></a></th>
            <th><a th:replace="~{fragments/layout :: sortable('status', 'Status')}"></a></th><th>Engineer</th><th><a th:replace="~{fragments/layout :: sortable('dueDate', 'Deadline')}"></a></th><th></th></tr></thead>
        <tbody><tr th:each="t : ${page.content}">
            <td><a class="cs-code" th:href="@{/remediation/{id}(id=${t.id})}" th:text="${t.taskCode}">R</a><div class="small fw-semibold" th:text="${t.title}">t</div></td>
            <td class="small"><span class="cs-code" th:text="${t.assetCode}">A</span> <span th:text="${t.assetName}">n</span>
                <div><span class="cs-code" th:text="${t.vulnCode}">V</span> <span th:replace="~{fragments/layout :: badge(${t.severity})}"></span></div></td>
            <td><span th:replace="~{fragments/layout :: badge(${t.priority})}"></span></td><td><span th:replace="~{fragments/layout :: badge(${t.status})}"></span></td>
            <td class="small" th:text="${t.engineerName ?: 'Unassigned'}">e</td>
            <td class="small text-nowrap"><span th:text="${t.dueDate != null ? #temporals.format(t.dueDate, 'dd MMM yyyy') : '-'}">d</span>
                <span th:if="${t.overdue}" class="badge cs-badge cs-overdue ms-1">Overdue</span></td>
            <td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/remediation/{id}(id=${t.id})}">Open</a></td>
        </tr></tbody>
    </table>
    <div class="cs-empty" th:if="${page.empty}"><i class="bi bi-clipboard-check"></i>No remediation tasks match your filters.</div>
</div><div th:replace="~{fragments/layout :: pagination(${page})}"></div></div>
<div class="card" th:if="${currentUser.engineer}"><div class="card-header"><i class="bi bi-clock-history me-2"></i>My recent task history</div>
    <div class="card-body"><ul class="cs-timeline" th:unless="${#lists.isEmpty(myHistory)}">
        <li th:each="h : ${myHistory}"><div class="small"><b th:text="${h.actionType.label}">a</b> - <span th:text="${h.description}">d</span></div>
            <div class="cs-time" th:text="|${#temporals.format(h.createdAt, 'dd MMM yyyy, HH:mm')} - ${h.performedBy}|">t</div></li></ul>
        <div class="cs-empty" th:if="${#lists.isEmpty(myHistory)}">No task activity yet.</div></div></div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
