# =====================================================================
# Test profile - used by "mvnw clean verify"
# Tests run ONLY against the separate cybershield_test database.
# =====================================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/cybershield_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:cybershield_user}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}

spring.flyway.enabled=true
spring.thymeleaf.cache=false

# Uploaded test evidence goes to a temporary directory, never the real uploads folder
cybershield.upload-dir=${java.io.tmpdir}/cybershield-test-uploads

# The scheduler is triggered manually by tests instead of running in the background
cybershield.scheduler.enabled=false
cybershield.demo-data.enabled=false

logging.level.com.cybershield=INFO
logging.level.org.hibernate.SQL=WARN
